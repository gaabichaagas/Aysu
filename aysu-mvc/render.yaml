services:
  - type: web
    name: aysu-mvc
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_PATH
        value: /var/data/aysu.sqlite3
    disk:
      name: aysu-data
      mountPath: /var/data
      sizeGB: 1
